services:
  - type: web
    name: drizzle-superheroes-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # defina manualmente no dashboard do Render com a URL do Neon
    healthCheckPath: /health
